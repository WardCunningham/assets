<div id=result>working</div>
<script type=module>
  import * as frame from 'http://code.fed.wiki/assets/v1/frame.js'
  const site = 'photos.ward.dojo.fed.wiki'
  const slug = 'little-libraries-to-explore'
  const page = await fetch(`http://${site}/${slug}.json`).then(res => res.json())
  const images = page.story.filter(item => item.type == 'image')
  const scale = .01
  const title = 'Regions'
  const story = []
  report(group(images,scale))
  const lat = item => item.text.split(",")[0]*1
  story.sort((a,b) => lat(b)-lat(a))
  window.result.innerHTML = `<button>preview</button> regions`
  const preview = event => frame.open({title,story},event.shiftKey)
  window.result.querySelector('button').addEventListener('click',preview)
  console.log(story.map(item => item.text.split("\n")[0]))

  function group(images, scale) {
     const square = loc =>
      Math.round(loc.latitude*69*scale) * 10000 -
      Math.round(loc.longitude*49*scale)
    const regions = Object.values(Object.groupBy(images,image => square(image.location)))
    for(let i = 0; i < regions.length; i++)
      if(regions[i].length > 20)
        regions[i] = group(regions[i],scale*2)
    return regions
  }

  function report(regions) {
    for(const region of regions) {
      if(Array.isArray(region[0])) report(region)
      else story.push({type:'map',text:region.map(markup).join("\n")})
    }
  }

  function markup(image) {
    const loc = image.location
    return `${loc.latitude}, ${loc.longitude} ${image.text}`
  }
</script>
